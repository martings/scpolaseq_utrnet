[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scpolaseq-utrnet"
version = "0.1.0"
description = "Evidence-aware 3′UTR regulatory graphs from frozen scPolASeq outputs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "anndata>=0.10", "pysam>=0.22", "networkx>=3", "PyYAML>=6", "plotly>=5", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
utrnet = "scpolaseq_utrnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
